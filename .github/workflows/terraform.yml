name: Terraform

# Every action below is pinned to a full commit SHA, not to a tag. A tag is
# mutable: the owner can move it to different code at any time. This workflow
# holds `id-token: write`, so a moved tag would hand an AWS role to whoever
# moved it. A commit SHA cannot change.
#
# The trailing comment records the human-readable version. Update the SHA and
# the comment together. Dependabot reads this form and bumps both.

# Plan runs on a pull request. Deploy runs on a push to a deployment branch.
# The two jobs never run together, because one event triggers only one of them.
#
# ---------------------------------------------------------------------------
# WHY THE DEPLOY JOB PLANS AND APPLIES IN THE SAME JOB
# ---------------------------------------------------------------------------
#
# The stronger design splits the work: one job saves a plan with
# `terraform plan -out=tfplan`, and a second gated job runs
# `terraform apply tfplan`. Terraform then applies exactly the plan the reviewer
# read, or it refuses to run. That refusal is the whole value of a saved plan.
#
# That design needs the plan file to travel between two jobs. The only built-in
# transport is a workflow artifact. Any person can download an artifact from a
# public repository, and a plan file holds every resource attribute, including
# the AWS account ID and any sensitive value. This repository is public, so the
# artifact is not an option here.
#
# A private transport does work. Write the plan to the Terraform state bucket
# under a run-scoped key, then read it back in the apply job:
#
#   aws s3 cp tfplan "s3://${STATE_BUCKET}/plans/${RUN_ID}-${ATTEMPT}.tfplan" \
#     --sse AES256
#
# That keeps the exact guarantee and publishes nothing. It also adds an S3
# prefix, a lifecycle rule to expire old plans, an extra `s3:PutObject` grant on
# the plan role, and a variable for the bucket name. Choose that route for a
# real production pipeline. This template stays simple instead, so the deploy
# job plans and applies back to back and the plan file never leaves the runner.
#
# Note that the deploy job still uses `-out=tfplan` and still runs
# `terraform apply tfplan`. Apply therefore executes the plan produced seconds
# earlier in the same job, not a fresh plan.
#
# ---------------------------------------------------------------------------
# THE TRADE-OFF, STATED PLAINLY
# ---------------------------------------------------------------------------
#
# The reviewer approves the deployment before the deploy job produces its plan.
# The reviewer therefore relies on the plan that the pull request published.
# The two plans match unless somebody changed AWS outside this pipeline between
# the approval and the run. Read the plan on the pull request before you
# approve, and treat an out-of-band change as the risk it is.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # A pull request reads its target branch. The `-plan` environment carries a
    # read-only role and has no reviewer, so the plan never waits for approval.
    environment: ${{ github.base_ref == 'main' && 'production-plan' || 'development-plan' }}
    env:
      # Resolved by expression, not by a shell command. A branch name reaches a
      # `run:` block as raw text, so shell interpolation of a ref is a script
      # injection pattern. This form has no shell to inject into.
      TF_ENV: ${{ github.base_ref == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # Environment-scoped secret. The value differs per environment.
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          role-session-name: github-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper rewrites stdout. `terraform show -json` must stay clean.
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform/environments/${{ env.TF_ENV }}
        # The plan file stays on the runner. Nothing uploads it.
        run: terraform plan -input=false -out=tfplan

      - name: Publish redacted plan summary
        working-directory: terraform/environments/${{ env.TF_ENV }}
        # This is the plan the reviewer reads before approving the deployment.
        #
        # It prints the action verb and the resource address only. It prints no
        # attribute value, so no account ID, bucket name, or secret reaches the
        # summary. `terraform show -json` output does hold every value, so
        # plan.json never leaves this step.
        #
        # Caution: a `for_each` key becomes part of a resource address. Never
        # use a secret as a `for_each` key.
        run: |
          terraform show -json tfplan > plan.json
          {
            echo "### Terraform plan — ${TF_ENV}"
            echo
            echo '| Action | Resource |'
            echo '|---|---|'
            jq -r '.resource_changes[]
                   | select(.change.actions != ["no-op"])
                   | "| \(.change.actions | join("+")) | `\(.address)` |"' plan.json
            echo
            jq -r '[.resource_changes[].change.actions[]]
                   | group_by(.) | map("\(.[0]): \(length)") | join(", ")' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.json

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # This environment carries the apply role and the required reviewers. The
    # approval gates every step below, including the plan.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TF_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          # Environment-scoped secret. The value differs per environment.
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          role-session-name: github-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform/environments/${{ env.TF_ENV }}
        # The saved plan feeds the apply step below. The file never leaves this
        # runner, so it needs no artifact and no bucket.
        run: terraform plan -input=false -out=tfplan

      - name: Publish redacted plan summary
        working-directory: terraform/environments/${{ env.TF_ENV }}
        # Records on the run page what this deployment is about to change.
        # Compare it against the summary on the pull request.
        run: |
          terraform show -json tfplan > plan.json
          {
            echo "### Terraform plan — ${TF_ENV}"
            echo
            echo '| Action | Resource |'
            echo '|---|---|'
            jq -r '.resource_changes[]
                   | select(.change.actions != ["no-op"])
                   | "| \(.change.actions | join("+")) | `\(.address)` |"' plan.json
            echo
            jq -r '[.resource_changes[].change.actions[]]
                   | group_by(.) | map("\(.[0]): \(length)") | join(", ")' plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f plan.json

      - name: Terraform Apply saved plan
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform apply -input=false tfplan

      - name: Deploy site content to S3
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          BUCKET=$(terraform output -raw site_bucket_name)
          aws s3 sync ../../../site "s3://${BUCKET}" --delete

      - name: Invalidate CloudFront cache
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          DIST_ID=$(terraform output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
